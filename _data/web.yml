o_mne:
  foto: images/veronika.jpg
  text: |-
    Jsem vystudovaná kosmetička, pedikérka, manikérka a masérka s maturitou. Svému oboru se věnuji od roku 2012, od roku 2016 jsem působila na Mělníku a věnovala se převážně pedikúře a kosmetice.

    Pedikérský obor jsem si zamilovala, vzdělávám se a inovuji. Kosmetiku dělám čistě a jemně, bez přístrojů – v tom vidím smysl u přírodní kosmetiky.
